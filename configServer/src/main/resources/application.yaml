spring:
  application:
    name: configServer

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/sarkarsnejuti/SpringBoot_Microservice_Project.git"
          default-label: master
          search-paths:
            - configServer/src/main/resources/config
          timeout: 90
          clone-on-start: true
          force-pull: true

encrypt:
  key: "45Da908NSH87CBVS221HBSN908GASRTQUG"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"

  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

  endpoint:
    health:
      probes:
        enabled: true