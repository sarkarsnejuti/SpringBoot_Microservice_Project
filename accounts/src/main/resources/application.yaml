spring:
  application:
    name: accounts

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import:
      - "application_qa.yaml"
      - "application_prod.yaml"

  profiles:
    active:
      - "prod"

server:
  port: 5050

build:
  version: "1.0"

accounts:
  message: "Welcome to EazyBank accounts related local REST Api"

